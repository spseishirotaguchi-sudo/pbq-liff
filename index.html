<script>
/* ============================================================
   p.b.q 練習日 参加投票 ＋ 参加状況 ＋ 友達紹介（1画面）
   フロント＝GitHub Pages / データ＝GAS API を fetch
   ============================================================ */
var LIFF_ID = "2011314745-16BXRKX0";
var API     = "https://script.google.com/macros/s/AKfycbwFleZTrYMBT1ih-WcEpUvVc59dq8e2Bz5M1iLdVBoBB84FP_P--JQm55u2wytCww5-Kg/exec";
var REFRESH_MS = 25000;

var state = { userId:"", lineName:"", idToken:"",
              practices:[], roster:[], mine:[], myGuests:[], myTrials:[],
              selected:{}, guests:[], expanded:{}, guestForm:false,
              hadEntries:false, busy:false, touched:false,
              isMember:false, isAdmin:false, adminView:false, adminLoaded:false, people:[],
              monthlyLimit:4, canVote:true, unlimited:false, myRemaining:{}, session:null,
              mode:"", trialDay:"", trialForm:false,
              hasProfile:true, myProfile:null, wards:[], profileBusy:false,
              fresh:false };   // fresh=サーバーから最新を受け取ったか（それまで送信させない）
var refreshTimer = null;
function qparam(k){ try{ return new URLSearchParams(location.search).get(k) || ""; }catch(e){ return ""; } }
function hasAdminParam(){ return qparam('admin') === '1'; }
function isTrialMode(){ return qparam('mode') === 'trial'; }
function isProfileMode(){ return qparam('mode') === 'profile'; }

/* 前回の表示内容を端末に保存しておき、次に開いたときはLINEの初期化を待たずにすぐ出す。
   最新の内容が届くまでは送信ボタンを押せないので、古い内容のまま保存されることはない。 */
var SNAP_KEY = 'pbq_snap_v2';
function saveSnapshot(){
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify({
    userId: state.userId, lineName: state.lineName,
    practices: state.practices, roster: state.roster, mine: state.mine, myGuests: state.myGuests,
    myTrials: state.myTrials, canVote: state.canVote, hasProfile: state.hasProfile, votingPaused: state.votingPaused,
    monthlyLimit: state.monthlyLimit, unlimited: state.unlimited, myRemaining: state.myRemaining,
    isMember: state.isMember, isAdmin: state.isAdmin, ts: Date.now()
  })); }catch(e){}
}
function loadSnapshot(){
  try{
    var s = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null');
    if (s && s.userId && s.practices && s.practices.length && (Date.now() - s.ts) < 12*60*60*1000) return s;
  }catch(e){}
  return null;
}
function applySnapshot_(s){
  state.userId = s.userId; state.lineName = s.lineName || '';
  state.practices = s.practices; state.roster = s.roster || [];
  state.mine = s.mine || []; state.myGuests = s.myGuests || []; state.myTrials = s.myTrials || [];
  state.canVote = s.canVote !== false; state.hasProfile = s.hasProfile !== false;
  state.monthlyLimit = Number(s.monthlyLimit) > 0 ? Number(s.monthlyLimit) : 4;
  state.unlimited = s.unlimited === true; state.myRemaining = s.myRemaining || {};
  state.isMember = !!s.isMember; state.isAdmin = !!s.isAdmin;
  state.votingPaused = s.votingPaused === true;
}

function q(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function showMsg(t,cls){ q('msg').innerHTML = t ? '<div class="msg '+(cls||'')+'">'+esc(t)+'</div>' : ''; if(t) window.scrollTo(0,0); }
function two(n){ return ('0'+n).slice(-2); }

/* Apps Script はときどき数十秒固まってから HTML の404を返すことがある。
   待ち時間に上限を設け、JSON以外が返ったら「混雑」として扱う。 */
function fetchJson_(url, opts, timeoutMs){
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, timeoutMs) : null;
  if (ctrl) opts.signal = ctrl.signal;
  function done(){ if (timer) clearTimeout(timer); }
  return fetch(url, opts).then(function(r){
    return r.text().then(function(t){
      done();
      try { return JSON.parse(t); }
      catch(e){ var err = new Error('サーバーが混み合っています'); err.busy = true; throw err; }
    });
  }, function(e){
    done();
    var err = new Error(e && e.name === 'AbortError' ? '応答に時間がかかっています' : '通信に失敗しました');
    err.busy = true; err.timeout = (e && e.name === 'AbortError');
    throw err;
  });
}
function wait_(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

/* HEDGE-BEGIN
   読み込みの「追いかけ送信」。Apps Script は寝起きの1回だけ7〜12秒かかり、別の1回は1秒で返る。
   そこで、HEDGE_MS 待っても返ってこなければ同じ読み込みをもう1本投げ、先に返った方を使う。
   （以前は10秒で打ち切っていたため、あと少しで返る寝起きの応答を捨ててやり直していた） */
var HEDGE_MS = 2500, GET_TIMEOUT_MS = 20000;
function hedgedGet_(url, fetcher){
  return new Promise(function(resolve, reject){
    var settled = false, launched = 0, failed = 0, lastErr = null, timer = null;
    function launch(){
      launched++;
      fetcher(url).then(function(d){
        if (settled) return;
        settled = true; if (timer) clearTimeout(timer); resolve(d);
      }, function(e){
        if (settled) return;
        failed++; lastErr = e;
        if (launched < 2){ if (timer) clearTimeout(timer); launch(); return; }   // 1本目が即失敗なら2本目をすぐ出す
        if (failed >= launched){ settled = true; reject(lastErr); }
      });
    }
    launch();
    timer = setTimeout(function(){ if (!settled && launched < 2) launch(); }, HEDGE_MS);
  });
}
/* HEDGE-END */

/* 読み込み：追いかけ送信つきで取りに行き、2本とも失敗したら少し待って1回だけやり直す */
function apiGet(params){
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
  var url = API + '?' + qs;
  function fetcher(u){ return fetchJson_(u, { method:'GET' }, GET_TIMEOUT_MS); }
  return hedgedGet_(url, fetcher).catch(function(){
    return wait_(800).then(function(){ return hedgedGet_(url, fetcher); });
  });
}

/* 送信：保存は時間がかかることがあるので長めに待つ。
   JSON以外（404など＝処理結果が返ってこなかった）のときだけ1回やり直す。
   サーバー側は「最終状態を保存する」作りなので、やり直しても二重登録にはならない。 */
function apiPost(body){
  var opts = function(){ return { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
                                  body: JSON.stringify(body) }; };
  return fetchJson_(API, opts(), 30000).catch(function(e){
    if (!e.busy || e.timeout) throw e;
    return wait_(800).then(function(){ return fetchJson_(API, opts(), 30000); });
  });
}
function handleAuthFail(d){ if (d && d.relogin){ try{ liff.login(); }catch(e){} return true; } return false; }

/* ---------------- 起動 ---------------- */
function boot(){
  if (isTrialMode()){ state.mode = 'trial'; state.trialDay = qparam('day'); }
  if (isProfileMode()){ state.mode = 'profile'; }
  // LINEの初期化（1〜3秒）を待たずに、前回の内容をすぐ表示する
  var snap = loadSnapshot();
  if (snap){ applySnapshot_(snap); paintSnapshot_(); }

  if (typeof liff === 'undefined'){
    showMsg('LINEの読み込みに失敗しました。通信環境を確認して開き直してください。','err'); return;
  }
  liff.init({ liffId: LIFF_ID })
    .then(function(){
      if (!liff.isLoggedIn()){ liff.login(); return null; }
      // IDトークンの中身にユーザーIDと名前が入っているので、プロフィール取得の通信を省く
      var dec = null;
      try { dec = liff.getDecodedIDToken(); } catch(e){ dec = null; }
      if (dec && dec.sub) return { userId: dec.sub, displayName: dec.name || '' };
      return liff.getProfile();
    })
    .then(function(p){
      if (!p) return;
      if (snap && snap.userId !== p.userId){ resetForOtherUser_(); }   // 端末で別のLINEアカウントに切り替えた場合
      state.userId   = p.userId;
      state.lineName = p.displayName || state.lineName || "";
      try { state.idToken = liff.getIDToken() || ""; } catch(e){ state.idToken = ""; }
      start(!!snap && snap.userId === p.userId);
    })
    .catch(function(e){
      showMsg('LINE初期化エラー: ' + (e && e.message ? e.message : e) + '\nLINEアプリ内から開き直してください。','err');
    });
}

var APP_VERSION = 'v4.5 (09/26)';
var FEW_LEFT_THRESHOLD = 3; // 残り数名バッジのしきい値（自分が入れる枠が3以下なら「残り数名」）

var SES = { am:{ label:'朝の部', note:'平日 9:00-12:00', kicker:'MORNING SESSION' },
            pm:{ label:'夜の部', note:'平日 19:00-22:00', kicker:'NIGHT SESSION' } };

function sesTagHtml(){
  if (!state.session) return '';
  var m = SES[state.session];
  return '<div class="sesbar"><button class="back" onclick="clearSession()">← 部を変える</button>'
       + '<span class="sestag ' + state.session + '">' + m.label + '</span></div>';
}

function renderHead_(){
  var name = '<div class="who"><span class="account-icon" aria-hidden="true">●</span><div><span class="account-label">ログイン中</span><b>' + esc(state.lineName) + '</b> さん</div></div>';
  if (state.mode === 'profile' || !state.hasProfile){
    q('head').innerHTML =
      '<div class="hero"><span class="kicker">WELCOME</span>' +
      '<h1>初回アンケート</h1>' +
      '<p class="sub">p.b.q への友だち追加ありがとうございます。<br>' +
      '練習日の申し込みに進むために、はじめに4つだけ教えてください。<b>1分で終わります。</b></p>' + name +
      '<div class="refline"><span class="ver">' + APP_VERSION + '</span></div></div>';
    return;
  }
  if (state.mode === 'trial'){
    q('head').innerHTML =
      '<div class="hero"><span class="kicker">FIRST TIME</span>' +
      '<h1>体験に申し込む</h1>' +
      '<p class="sub">行きたい日を<b>1つ</b>選んで送信してください。体験枠には限りがあり、満席の日は選べません。<br>' +
      '送信すると当日の持ち物・流れをLINEにお送りします。</p>' + name +
      '<div class="refline"><span class="ver">' + APP_VERSION + '</span></div></div>';
    return;
  }
  q('head').innerHTML =
    '<div class="hero' + (state.session ? ' compact' : '') + '"><span class="kicker">YOUR NEXT GAME</span>' +
    '<h1>練習日を選ぶ</h1>' +
    '<p class="sub">参加したい日を選び、下のボタンで送信してください。<br>満席の日はキャンセル待ちで受け付けます。</p>' +
    '<p class="sub" id="limit-lead"></p>' + name +
    '<div class="refline"><span class="live"><span class="dot" id="dot"></span><span id="fresh">読み込み中…</span>' +
    '<span class="ver">' + APP_VERSION + '</span></span>' +
    '<button id="refreshBtn">更新</button></div></div>';
  var rb = q('refreshBtn');
  // 最新の読み込みに失敗している間は、「更新」で全体を読み直す
  if (rb) rb.addEventListener('click', function(){ if (!state.fresh) loadAll(); else silentRefresh(true); });
}

function paintSnapshot_(){
  if (state.mode !== 'trial') seedFromServer();
  renderHead_();
  render();
  var f = q('fresh'); if (f) f.textContent = '前回の内容を表示中・最新を読み込み中…';
  updateSubmitBtn();
}
function resetForOtherUser_(){
  state.practices = []; state.roster = []; state.mine = []; state.myGuests = []; state.myTrials = [];
  state.selected = {}; state.touched = false; state.myRemaining = {};
  state.canVote = true; state.hasProfile = true; state.isAdmin = false; state.isMember = false;
  q('root').innerHTML = '';
}

function start(painted){
  renderHead_();
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) silentRefresh(false); });
  if (painted){
    render();
    var f = q('fresh'); if (f) f.textContent = '前回の内容を表示中・最新を読み込み中…';
  }
  updateSubmitBtn();
  loadAll();
}

function seedFromServer(){
  state.hadEntries = (state.mine.length > 0) || (state.myGuests.length > 0);
  if (state.touched) return;
  state.selected = {};
  state.mine.forEach(function(m){ state.selected[m.practiceId] = true; });
  state.guests = [];
  var _unusedGuests = (state.myGuests || []).map(function(g){
    return { name:g.name, age:g.age, gender:g.gender, practiceId:g.practiceId };
  });
}

/* ---------------- データ取得 ---------------- */
function loadAll(){
  state.loadFailed = false; updateSubmitBtn();
  apiGet({ api:'bootstrap', userId: state.userId, name: state.lineName, idToken: state.idToken })
    .then(function(d){
      if (!d.ok){ if (handleAuthFail(d)) return; state.loadFailed = true; updateSubmitBtn(); markLive(false); showMsg('データ取得に失敗: ' + d.error, 'err'); return; }
      state.practices = d.practices; state.roster = d.roster;
      state.mine = d.mine || []; state.myGuests = d.myGuests || []; state.myTrials = d.myTrials || [];
      state.isMember = !!d.isMember; state.isAdmin = !!d.isAdmin;
      state.monthlyLimit = Number(d.monthlyLimit) > 0 ? Number(d.monthlyLimit) : 4;
      state.canVote = d.canVote !== false;
      state.votingPaused = d.votingPaused === true;
      state.unlimited = d.unlimited === true;
      state.myRemaining = d.myRemaining || {};
      state.hasProfile = d.hasProfile !== false;
      state.myProfile = d.myProfile || null;
      state.wards = d.wards || [];
      // アンケート未回答なら、どの画面から来ても回答画面に固定する
      if (!state.hasProfile) state.mode = 'profile';
      else if (state.mode === 'profile' && !isProfileMode()) state.mode = '';
      if (state.isAdmin && hasAdminParam() && !state.adminViewInit){ state.adminViewInit = true; state.adminView = true; loadAdmin(); }
      state.fresh = true;
      seedFromServer();
      renderHead_();
      markLive(true);
      render();
      updateSubmitBtn();
      saveSnapshot();
      scheduleRefresh();
    })
    .catch(function(e){ state.loadFailed = true; updateSubmitBtn(); markLive(false); showMsg('つながりにくくなっています（' + (e && e.message ? e.message : e) + '）。\n少し待ってから「更新」を押すか、画面を閉じて開き直してください。', 'err'); scheduleRefresh(); });
}

/* ---------------- 管理モード（運営のみ） ---------------- */
function openAdmin(){ state.adminView = true; state.adminLoaded = false; loadAdmin(); render(); }
function closeAdmin(){ state.adminView = false; renderHead_(); markLive(true); render(); }
function loadAdmin(){
  apiGet({ api:'admin_list', userId: state.userId, idToken: state.idToken })
    .then(function(d){
      if (!d.ok){ showMsg('管理データ取得に失敗: ' + (d.error||''), 'err'); return; }
      state.people = d.people || [];
      state.adminLoaded = true;
      if (state.adminView) render();
    })
    .catch(function(e){ showMsg('通信エラー: ' + e, 'err'); });
}
function setTier(uid, tier, btn){
  if (btn){ btn.disabled = true; btn.textContent = '変更中…'; }
  apiPost({ action:'set_tier', userId: state.userId, idToken: state.idToken, targetUid: uid, tier: tier })
    .then(function(d){
      if (!d.ok) throw new Error(d.error || '変更できませんでした');
      state.people = d.people || state.people;
      renderAdmin();
    })
    .catch(function(e){ showMsg(String(e.message || e), 'err'); renderAdmin(); });
}

function setMemberFlag(uid, value, btn){
  if (btn){ btn.disabled = true; btn.textContent = '…'; }
  apiPost({ action:'set_member', userId: state.userId, idToken: state.idToken, targetUid: uid, value: value })
    .then(function(d){
      if (!d.ok){ showMsg('変更に失敗: ' + (d.error||''), 'err'); if(btn) btn.disabled=false; return; }
      state.people = d.people || state.people;
      render();
    })
    .catch(function(e){ showMsg('通信エラー: ' + e, 'err'); if(btn) btn.disabled=false; });
}
function renderAdmin(){
  var groups = [
    { key:'trial',  title:'体験者・未設定' },
    { key:'semi',   title:'準メンバー' },
    { key:'member', title:'メンバー' }
  ];
  function tierBtn(p, tier, label, cls){
    if (p.tier === tier) return '<span class="adbtn" style="opacity:.4;pointer-events:none">' + label + '</span>';
    return '<button class="adbtn ' + cls + '" onclick="setTier(\'' + p.uid + '\', \'' + tier + '\', this)">' + label + '</button>';
  }
  function rowHtml(p){
    var prof = p.hasProfile
      ? '<div class="admeta">' + esc(p.realName || '—') + '／' + esc(p.ward || '—')
        + '／' + esc(p.gender || '—') + '／' + esc(p.birthday || '—') + '</div>'
      : '<div class="admeta" style="color:#b23a2e">アンケート未回答</div>';
    return '<div class="adrow"><div class="adcol"><div class="adnm">' + esc(p.name || '(名前未取得)') + '</div>'
      + prof
      + '<div class="admeta">初回 ' + esc(p.first || '—') + '　体験 ' + p.trials + '回　現在：' + esc(p.tierLabel || p.tier) + '</div></div>'
      + '<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">'
      +   tierBtn(p, 'trial',  '体験',   'back')
      +   tierBtn(p, 'semi',   '準',     'make')
      +   tierBtn(p, 'member', 'メンバー', 'make')
      + '</div></div>';
  }
  q('head').innerHTML = '<h1>🔧 会員種別の管理</h1>'
    + '<p class="sub">体験／準メンバー／メンバーを切り替えます。変更するとリッチメニューが切り替わり、本人にお知らせが届きます。<br>'
    + '体験→準メンバーは初参加日の21時、準メンバー→メンバーは毎月24日22時に自動で上がります。</p>'
    + '<button id="backBtn" class="refline" style="border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:#fff;font-weight:700">← フォームに戻る</button>';
  q('backBtn').addEventListener('click', closeAdmin);
  if (!state.adminLoaded){
    q('root').innerHTML = '<div class="loading">読み込み中…</div>';
    q('footer').style.display = 'none';
    return;
  }
  var h = '';
  groups.forEach(function(g){
    var list = state.people.filter(function(p){ return (p.tier || (p.member ? 'member' : 'trial')) === g.key; });
    h += '<div class="gbox"><div class="gbox-h">' + g.title + '（' + list.length + '）</div>';
    h += list.length ? list.map(rowHtml).join('') : '<div class="admeta" style="padding:8px 0">いません</div>';
    h += '</div>';
  });
  q('root').innerHTML = h;
  q('footer').style.display = 'none';
}

function silentRefresh(manual){
  if (state.busy || state.guestForm || state.trialForm) return;
  if (state.mode === 'trial'){ if (!manual) scheduleRefresh(); return; }
  apiGet({ api:'roster', idToken: state.idToken })
    .then(function(d){
      if (d && d.ok && d.roster){
        state.roster = d.roster;
        var y = window.scrollY;
        markLive(true); render();
        window.scrollTo(0, y);
        saveSnapshot();
      } else { markLive(false); }
      if (!manual) scheduleRefresh();
    })
    .catch(function(){ markLive(false); if (!manual) scheduleRefresh(); });
  if (manual) scheduleRefresh();
}
function scheduleRefresh(){
  if (state.mode === 'trial') return;
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(function(){
    if (document.hidden || state.busy || state.guestForm){ scheduleRefresh(); return; }
    silentRefresh(false);
  }, REFRESH_MS);
}
function markLive(ok){
  var dot = q('dot'); if (dot) dot.className = 'dot' + (ok ? '' : ' off');
  var f = q('fresh'); if (!f) return;
  var t = new Date();
  f.textContent = (ok ? '自動更新中（約' + (REFRESH_MS/1000) + '秒）・' : '更新失敗・') +
    two(t.getHours()) + ':' + two(t.getMinutes());
}

/* 友達紹介リンクの一時停止（メンバー移行期間中）。2026-09-25、移行モード終了に伴い再開 */
var INVITE_OPEN_FROM = new Date(2026, 8, 25, 0, 0, 0);   // 2026-09-25 再開
function inviteClosed_(){ return new Date() < INVITE_OPEN_FROM; }
function inviteClosedHtml_(){
  return '<div class="gbox"><div class="gbox-h">友達を誘うときは</div>'
    + '<p class="gbox-sub">現在はメンバーの登録期間のため、友達の紹介を一時的にお休みしています。</p>'

function copyInvite(btn){
  function done(ok){
    if (!btn) return;
    btn.textContent = ok ? '✓ コピーしました' : 'コピーできませんでした';
    btn.style.background = ok ? '#2e9e5b' : '#999';
    setTimeout(function(){ btn.textContent = 'リンクをコピー'; btn.style.background = ''; }, 1800);
  }
  // LINEアプリ内ブラウザでは clipboard API が使えないことがあるので、両方試す
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(INVITE_URL).then(function(){ done(true); }, function(){ done(fallbackCopy()); });
      return;
    }
  } catch(e){}
  done(fallbackCopy());
}

function fallbackCopy(){
  try {
    var ta = document.createElement('textarea');
    ta.value = INVITE_URL;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}

function remainingPicks(){ return Math.max(0, state.monthlyLimit - selectedCount()); }

function pById(pid){ for (var i=0;i<state.practices.length;i++) if (state.practices[i].id===pid) return state.practices[i]; return null; }
function rosterFor(pid){ for (var i=0;i<state.roster.length;i++) if (state.roster[i].id===pid) return state.roster[i]; return null; }
function mineFor(pid){ for (var i=0;i<state.mine.length;i++) if (state.mine[i].practiceId===pid) return state.mine[i]; return null; }
function guestStatusOf(g){
  for (var i=0;i<state.myGuests.length;i++){
    var m = state.myGuests[i];
    if (m.practiceId===g.practiceId && m.name===g.name) return m;
  }
  return null;
}

function nameList(arr){
  if (!arr || !arr.length) return '<li class="none">まだいません</li>';
  return arr.map(function(n){ return '<li>' + esc(n || '(名前なし)') + '</li>'; }).join('');
}

function sessionOf(p){
  if (!p) return 'pm';
  if (p.session === 'am' || p.session === 'pm') return p.session;
  // GASが旧版で session を返さない場合でも動くようにする
  var m = String(p.time || '').match(/(\d{1,2})\s*[:：]/);
  if (m) return Number(m[1]) < 12 ? 'am' : 'pm';
  if (/朝/.test(String(p.place || '') + String(p.time || ''))) return 'am';
  return 'pm';
}
function practicesIn(ses){ return state.practices.filter(function(p){ return sessionOf(p) === ses; }); }
function pickSession(ses){ state.session = ses; showMsg('',''); window.scrollTo(0,0); renderHead_(); render(); }

function render(){
  if (!state.hasProfile){ renderProfile(); return; }
  if (state.adminView){ renderAdmin(); return; }
  if (state.mode === 'profile'){ renderProfile(); return; }
  if (state.mode === 'trial'){ renderTrial(); return; }
  if (state.votingPaused && !state.isAdmin){ renderVotingPaused(); return; }
  if (!state.practices.length){
    q('root').innerHTML = '<div class="msg err">現在、募集中の練習日がありません。</div>';
    q('footer').style.display = 'none';
    return;
  }
  if (!state.session){ renderSessionPicker(); return; }
  var inSes = practicesIn(state.session);
  var html = (state.votingPaused ? '<div class="msg err">【運営のみ表示】参加投票は一時停止中です。メンバーには停止のお知らせが表示されています。</div>' : '')
    + sesTagHtml() + '<div class="section-label"><span>02</span> 参加したい日を選択</div><p class="selection-help">チェックを外して送信すると、その日の申込みを取り消します。</p>';
  if (!inSes.length){
    q('root').innerHTML = html + '<div class="msg err">' + SES[state.session].label + 'は今月の開催がありません。「部を変える」から選び直してください。</div>';
    q('footer').style.display = 'none';
    return;
  }
  inSes.forEach(function(p){
    var r = rosterFor(p.id) || { members:[], membersWait:[], trials:[], capMembers:p.capacity };
    var mine = mineFor(p.id);
    // 参加者側ではメンバー／準メンバーを区別しない（運営の内部管理のみ）
    var confList = r.members || r.confirmed || [];
    var waitList = r.membersWait || r.waitlist || [];
    var conf = confList.length, wait = waitList.length;
    var cap = r.capMembers || ((r.capacity || 0) + (r.capSemi || 0)) || p.capacity;
    var trials = (r.trials || []), tn = trials.length;
    var sel = !!state.selected[p.id];
    var open = !!state.expanded[p.id];

    var badge;
    // 空き判定は「自分が入れる枠」で見る（種別は画面に出さない）
    var left = state.myRemaining[p.id];
    if (left === undefined) left = cap - conf;
    if (mine && mine.status === 'confirmed')      badge = '<span class="badge b-mine">投票済み・参加確定</span>';
    else if (mine && mine.status === 'waitlist')  badge = '<span class="badge b-wait">キャンセル待ち ' + mine.waitlistPos + '番目</span>';
    else if (left <= 0)                           badge = '<span class="badge b-full">満席・キャンセル待ち受付</span>';
    else if (left <= FEW_LEFT_THRESHOLD)          badge = '<span class="badge b-few">残り数名！</span>';
    else                                          badge = '<span class="badge b-open">まだ空きあります！</span>';

    if (sel && !mine) badge = '<span class="badge b-pending">追加予定・未送信</span>' + badge;
    if (!sel && mine) badge = '<span class="badge b-cancel">取消予定・未送信</span>' + badge;
    var pct = Math.min(100, Math.round(conf / cap * 100));
    var tp = [p.time, p.place].filter(function(s){ return s; }).join(' ・ ');

    html += '<div class="day ' + (sel ? 'sel' : '') + '">'
      + '<div class="pick" role="checkbox" tabindex="0" aria-checked="' + (sel ? 'true' : 'false') + '" data-pid="' + esc(p.id) + '" onclick="toggle(\'' + p.id + '\')">'
      +   '<div class="cb" aria-hidden="true">' + (sel ? '✓' : '') + '</div>'
      +   '<div class="body">'
      +     '<div class="d">' + esc(p.date || p.label) + '</div>'
      +     (tp ? '<div class="tp">' + esc(tp) + '</div>' : '')
      +     '<div class="meta">受付 ' + conf + ' 名' + (wait > 0 ? '　・　キャンセル待ち ' + wait + ' 名' : '') + (tn > 0 ? '　・　体験 ' + tn + ' 名' : '') + '</div>'
      +     '<div>' + badge + '</div>'
      +   '</div>'
      + '</div>'
      + '<button class="rtoggle" aria-controls="rp-' + esc(p.id) + '" aria-expanded="' + (open ? 'true' : 'false') + '" onclick="toggleExpand(\'' + p.id + '\')">'
      +   '<span>参加者リスト（確定 ' + conf + (wait > 0 ? ' ／ 待ち ' + wait : '') + (tn > 0 ? ' ／ 体験 ' + tn : '') + '）</span><span class="arw">▼</span>'
      + '</button>'
      + '<div class="rpanel" id="rp-' + p.id + '" ' + (open ? '' : 'hidden') + '>'
      +   '<div class="rgrp"><div class="rt">受付（' + conf + '）</div><ol>' + nameList(confList) + '</ol></div>'
      +   (wait > 0 ? '<div class="rgrp w"><div class="rt">キャンセル待ち（' + wait + '・先着順）</div><ol>' + waitList.map(function(n){ return '<li>' + esc(n || '(名前なし)') + '</li>'; }).join('') + '</ol></div>' : '')
      +   (tn > 0 ? '<div class="rgrp"><div class="rt">体験（' + tn + ' / ' + (r.capTrial || p.capTrial || 0) + '）</div><ol>' + trials.map(function(n){ return '<li>' + esc(n || '(名前なし)') + '</li>'; }).join('') + '</ol></div>' : '')
      + '</div>'
      + '</div>';
  });

  html += inviteBoxHtml();
  if (state.isAdmin){
    html += '<div style="text-align:center;margin-top:18px"><button onclick="openAdmin()" '
      + 'style="background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:12px;color:var(--sub);font-weight:700">🔧 メンバー管理</button></div>';
  }

  q('root').innerHTML = html;
  var ll = q('limit-lead');
  if (ll){
    if (!state.session) ll.innerHTML = '';
    else if (state.unlimited) ll.innerHTML = '運営アカウントのため、<b>すべての練習日</b>を選べます。現在 <b>' + selectedInSession(state.session) + '日</b> 選択中。';
    else {
      var used = selectedInSession(state.session);
      ll.innerHTML = '<b>' + SES[state.session].label + '</b>に参加できるのは月に <b>' + state.monthlyLimit
        + '回</b>まで。現在 <b>' + used + '回</b> 選択中（残り ' + Math.max(0, state.monthlyLimit - used) + '回）。';
    }
  }
  q('footer').style.display = 'block';
  updateSubmitBtn();
  if (state.guestForm){ var n = q('gf-name'); if (n) n.focus(); }
}

  var name = (q('gf-name').value || '').trim();

    + '<p class="note">この結果はLINEには送られません。スクリーンショットで控えるか、いつでもこの「参加投票」画面を開き直せば同じ内容を確認できます。</p>';
  if (ok.length)   h += '<div class="grp ok"><div class="t">参加確定</div><ul>' + ok.map(function(r){ return '<li>'+esc(r.label)+'</li>'; }).join('') + '</ul></div>';
  if (wait.length) h += '<div class="grp wait"><div class="t">キャンセル待ち（定員オーバーのため）</div><ul>' + wait.map(function(r){ return '<li>'+esc(r.label)+'</li>'; }).join('') + '</ul><div class="note">空きが出た時点で、先着順にLINEで「参加できます」の通知が届きます。友達の分は紹介者に通知します。</div></div>';
  if (cxl.length)  h += '<div class="grp cxl"><div class="t">取り消し</div><ul>' + cxl.map(function(r){ return '<li>'+esc(r.label)+'</li>'; }).join('') + '</ul></div>';
  if (!ok.length && !wait.length && !cxl.length) h += '<div class="note">日程が選択されていません（＝すべて取り消し）。</div>';
  h += '<div class="note">予定が変わったら、選び直して再送信してください。</div></div>';
  q('result').innerHTML = h;
  window.scrollTo(0,0);
}

/* ---------------- 友だち追加時アンケート ---------------- */
function renderProfile(){
  var p = state.myProfile || {};
  var wards = (state.wards && state.wards.length) ? state.wards
    : ['東区','博多区','中央区','南区','城南区','早良区','西区','福岡市外'];
  var wardOpts = '<option value="">選んでください</option>' + wards.map(function(w){
    return '<option value="' + esc(w) + '"' + (p.ward === w ? ' selected' : '') + '>' + esc(w) + '</option>';
  }).join('');
  function genOpt(v){ return '<option' + (p.gender === v ? ' selected' : '') + '>' + v + '</option>'; }

  var bd = String(p.birthday || '').split('-');
  var by = bd[0] || '';
  var bm = bd[1] ? String(Number(bd[1])) : '';
  var bdd = bd[2] ? String(Number(bd[2])) : '';

  var done = state.hasProfile;
  var h = '<div class="gbox">'
    + '<div class="gbox-h">' + (done ? '登録内容の変更' : 'アンケート（4項目）') + '</div>'
    + '<p class="gbox-sub">当日の受付と、会場のご案内に使わせてもらいます。'
    + (done ? '' : '<b>回答すると、練習日の申し込みメニューが使えるようになります。</b>')
    + '</p>'
    + '<div class="gform">'
    +   '<label for="pf-name">お名前（フルネーム）</label>'
    +   '<input id="pf-name" placeholder="例：田中 太郎" autocomplete="name" value="' + esc(p.realName || '') + '">'
    +   '<label>生年月日</label>'
    +   '<div class="bdrow">'
    +     '<input id="pf-y" aria-label="生まれた年・西暦" class="y" type="number" inputmode="numeric" placeholder="1998" value="' + esc(by) + '"><em>年</em>'
    +     '<input id="pf-m" aria-label="生まれた月" class="m" type="number" inputmode="numeric" placeholder="4" value="' + esc(bm) + '"><em>月</em>'
    +     '<input id="pf-d" aria-label="生まれた日" class="d" type="number" inputmode="numeric" placeholder="15" value="' + esc(bdd) + '"><em>日</em>'
    +   '</div>'
    +   '<label for="pf-ward">お住まいの区</label>'
    +   '<select id="pf-ward">' + wardOpts + '</select>'
    +   '<label for="pf-gender">性別</label>'
    +   '<select id="pf-gender">' + genOpt('男性') + genOpt('女性') + genOpt('その他') + '</select>'
    +   '<div class="gform-btns"><button class="add" onclick="submitProfile()">'
    +     (done ? 'この内容に変更する' : '回答して申し込みに進む') + '</button></div>'
    + '</div></div>';

  q('root').innerHTML = h;
  q('footer').style.display = 'none';
}

function submitProfile(){
  if (state.profileBusy) return;
  if (!state.fresh){ showMsg('読み込み中です。数秒待ってから送信してください。',''); return; }
  if (!state.userId){ showMsg('LINEユーザー情報が取得できていません。開き直してください。','err'); return; }
  var realName = (q('pf-name') && q('pf-name').value || '').trim();
  var yy = (q('pf-y') && q('pf-y').value || '').trim();
  var mm = (q('pf-m') && q('pf-m').value || '').trim();
  var dd = (q('pf-d') && q('pf-d').value || '').trim();
  var ward     = q('pf-ward') ? q('pf-ward').value : '';
  var gender   = q('pf-gender') ? q('pf-gender').value : '';

  if (!realName){ showMsg('お名前を入力してください。','err'); return; }
  if (!yy || !mm || !dd){ showMsg('生年月日を、年・月・日すべて入力してください。','err'); return; }
  var ny = Number(yy), nm = Number(mm), nd = Number(dd);
  var thisYear = new Date().getFullYear();
  if (!(ny >= 1930 && ny <= thisYear)){ showMsg('生年月日の「年」は西暦4桁で入力してください（例：1998）。','err'); return; }
  if (!(nm >= 1 && nm <= 12)){ showMsg('生年月日の「月」は1〜12で入力してください。','err'); return; }
  if (!(nd >= 1 && nd <= 31)){ showMsg('生年月日の「日」は1〜31で入力してください。','err'); return; }
  var birthday = ny + '-' + two(nm) + '-' + two(nd);
  if (!ward){ showMsg('お住まいの区を選んでください。','err'); return; }

  state.profileBusy = true;
  var btns = document.querySelectorAll('.gform-btns button');
  for (var i=0;i<btns.length;i++){ btns[i].disabled = true; }
  showMsg('送信中…','');

  apiPost({ action:'save_profile', lineUserId: state.userId, lineName: state.lineName,
            idToken: state.idToken, realName: realName, birthday: birthday, ward: ward, gender: gender })
    .then(function(res){
      state.profileBusy = false;
      if (!res.ok){ if (handleAuthFail(res)) return; showMsg('送信に失敗しました: ' + (res.error||''),'err'); render(); return; }
      state.hasProfile = true;
      state.mode = '';
      showMsg('','');
      q('result').innerHTML = '<div class="result"><h2>✅ 回答ありがとうございます</h2>'
        + '<div class="note">メニューが切り替わりました。トーク画面を一度閉じて開き直すと、'
        + '下のメニューから練習日の申し込みができるようになります。</div></div>';
      window.scrollTo(0,0);
      renderHead_();
      loadAll();
    })
    .catch(function(e){ state.profileBusy = false; showMsg('送信に失敗しました（通信）: ' + e,'err'); render(); });
}

/** 申込み系APIが「アンケート未回答」で弾いたときに、回答画面へ戻す */
function handleNeedProfile(res){
  if (res && /__NEEDPROFILE__/.test(String(res.error || ''))){
    state.hasProfile = false; state.mode = 'profile';
    showMsg('先にアンケートへの回答をお願いします。','err');
    renderHead_(); render();
    return true;
  }
  return false;
}

/* ---------------- 体験申し込みモード ---------------- */
function trialLeft(pid){
  var r = rosterFor(pid), p = pById(pid);
  if (!p) return 0;
  var used = r ? (r.trials ? r.trials.length : 0) : 0;
  return Math.max(0, (p.capTrial || 0) - used);
}
function myTrial(){ return (state.myTrials && state.myTrials[0]) || null; }

function renderTrial(){
  if (!state.practices.length){
    q('root').innerHTML = '<div class="msg err">現在、募集中の練習日がありません。しばらくしてから開き直してください。</div>';
    q('footer').style.display = 'none';
    return;
  }
  var mt = myTrial();
  var h = '';

  if (mt && !state.trialForm){
    var mp = pById(mt.practiceId);
    var dl = mp ? (mp.date + '　' + mp.time + (mp.place ? '　' + mp.place : '')) : mt.practiceId;
    h += '<div class="result"><h2>体験を申し込み済みです</h2>'
      + '<div class="grp ok"><div class="t">' + esc(dl) + '</div>'
      + '<ul><li>' + esc(mt.name) + '（' + esc(mt.age) + '）' + esc(mt.gender) + '</li></ul></div>'
      + '<div class="note">当日の持ち物・流れはLINEのトークに送っています。</div>'
      + '<div class="gform-btns" style="margin-top:12px">'
      +   '<button class="add" onclick="openTrialForm()">日程・内容を変更</button>'
      +   '<button onclick="cancelTrial()">申し込みを取り消す</button>'
      + '</div></div>';
    if (state.isAdmin){
      h += '<div style="text-align:center;margin-top:18px"><button onclick="openAdmin()" '
        + 'style="background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:12px;color:var(--sub);font-weight:700">🔧 メンバー管理</button></div>';
    }
    q('root').innerHTML = h;
    q('footer').style.display = 'none';
    return;
  }

  if (!state.session){ renderSessionPicker(); return; }
  h += sesTagHtml();

  var preset = state.trialDay || (mt ? mt.practiceId : '');
  var opts = practicesIn(state.session).map(function(p){
    var left = trialLeft(p.id);
    var tp = [p.time, p.place].filter(function(s){return s;}).join(' ');
    var lbl = p.date + (tp ? '　' + tp : '');
    if (left <= 0) return '<option value="' + esc(p.id) + '" disabled>' + esc(lbl) + '（満席）</option>';
    var selAttr = (p.id === preset) ? ' selected' : '';
    return '<option value="' + esc(p.id) + '"' + selAttr + '>' + esc(lbl) + '（体験枠 残り' + left + '）</option>';
  }).join('');

  var nm = (mt && mt.name) || state.lineName || '';
  var ag = (mt && mt.age) || '';
  var gd = (mt && mt.gender) || '男性';
  var rf = (mt && mt.referrer) || '';
  function genOpt(v){ return '<option' + (v===gd?' selected':'') + '>' + v + '</option>'; }

  if (!practicesIn(state.session).length){
    h += '<div class="msg err">' + SES[state.session].label + 'は今月の開催がありません。「部を変える」から選び直してください。</div>';
    q('root').innerHTML = h;
    q('footer').style.display = 'none';
    return;
  }

  h += '<div class="gbox">'
    + '<div class="gbox-h">' + (mt ? '体験の内容を変更' : '体験に申し込む') + '</div>'
    + '<p class="gbox-sub">行きたい日を選び、お名前・年齢・性別を入力して送信してください。'
    + 'メンバーの方に誘われた場合は、<b>紹介者のお名前</b>も入れてください（任意）。'
    + '当日は開始時間までに体育館の正面入り口に集合、参加費は500円です。'
    + '<br><b>※ p.b.qは20代（20〜29歳）限定のサークルです。</b></p>'
    + '<div class="gform">'
    +   '<label for="tr-day">参加する練習日</label><select id="tr-day">' + opts + '</select>'
    +   '<label for="tr-name">お名前</label><input id="tr-name" placeholder="お名前" autocomplete="name" value="' + esc(nm) + '">'
    +   '<label>年齢・性別</label><div class="row"><input id="tr-age" aria-label="年齢" class="age" type="number" inputmode="numeric" placeholder="年齢" min="0" max="99" value="' + esc(ag) + '" oninput="clearTrialErr()">'
    +   '<select id="tr-gender" aria-label="性別" class="gen">' + genOpt('男性') + genOpt('女性') + genOpt('その他') + '</select></div>'
    +   '<div id="tr-err" class="msg err" role="alert" style="margin:0" hidden></div>'
    +   '<label for="tr-ref">紹介者のお名前（任意）</label><input id="tr-ref" placeholder="例：田中 太郎" value="' + esc(rf) + '">'
    +   '<div class="gform-btns">'
    +     '<button class="add" onclick="submitTrial()">' + (mt ? 'この内容で変更' : '体験を申し込む') + '</button>'
    +     (mt ? '<button onclick="closeTrialForm()">やめる</button>' : '')
    +   '</div>'
    + '</div></div>';

  if (state.isAdmin){
    h += '<div style="text-align:center;margin-top:18px"><button onclick="openAdmin()" '
      + 'style="background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:12px;color:var(--sub);font-weight:700">🔧 メンバー管理</button></div>';
  }

  q('root').innerHTML = h;
  q('footer').style.display = 'none';
}

function showTrialErr(t){
  var e = q('tr-err'), a = q('tr-age');
  if (e){ e.textContent = t; e.hidden = false; }
  if (a){ a.style.borderColor = 'var(--brick)'; a.style.borderWidth = '2px'; a.focus(); }
}
function clearTrialErr(){
  var e = q('tr-err'), a = q('tr-age');
  if (e){ e.hidden = true; e.textContent = ''; }
  if (a){ a.style.borderColor = ''; a.style.borderWidth = ''; }
}

function openTrialForm(){ state.trialForm = true; showMsg('',''); render(); }
function closeTrialForm(){ state.trialForm = false; showMsg('',''); render(); }

function submitTrial(){
  if (!state.fresh){ showMsg('読み込み中です。数秒待ってから送信してください。',''); return; }
  if (!state.userId){ showMsg('LINEユーザー情報が取得できていません。開き直してください。','err'); return; }
  var pid = q('tr-day') ? q('tr-day').value : '';
  var name = (q('tr-name') && q('tr-name').value || '').trim();
  var age = (q('tr-age') && q('tr-age').value || '').trim();
  var gender = q('tr-gender') ? q('tr-gender').value : '';
  var referrer = (q('tr-ref') && q('tr-ref').value || '').trim();
  if (!pid){ showMsg('体験に行きたい日を選んでください（満席の日は選べません）。','err'); return; }
  if (!name){ showMsg('お名前を入力してください。','err'); return; }
  if (!age){ showMsg('年齢を入力してください。','err'); return; }
  var ageN = parseInt(age.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }), 10);
  if (!(ageN >= 20 && ageN <= 29)){ showTrialErr('p.b.qは20代限定のサークルのため、20代以外の方のお申し込みはお断りしております。'); return; }
  var btns = document.querySelectorAll('.gform-btns button');
  for (var i=0;i<btns.length;i++){ btns[i].disabled = true; }
  showMsg('送信中…','');
  state.busy = true;
  apiPost({ action:'submit_trial', lineUserId: state.userId, lineName: state.lineName, idToken: state.idToken,
            practiceId: pid, name: name, age: age, gender: gender, referrer: referrer })
    .then(function(res){
      state.busy = false;
      if (!res.ok){ if (handleAuthFail(res) || handleNeedProfile(res)) return; showMsg('送信に失敗しました: ' + (res.error||''),'err'); render(); return; }
      if (res.full){ showMsg('その日は体験枠が満席です。別の日を選んでください。','err'); state.trialForm = true; loadAll(); return; }
      state.trialForm = false;
      showMsg('','');
      q('result').innerHTML = '<div class="result"><h2>✅ 体験を申し込みました</h2>'
        + '<div class="note">当日の持ち物・流れ・集合場所を、LINEのトークにお送りしました。ご確認ください。'
        + '予定が変わったら、このページから変更・取り消しができます。</div></div>';
      window.scrollTo(0,0);
      loadAll();
    })
    .catch(function(e){ state.busy = false; showMsg('送信に失敗しました（通信）: ' + e,'err'); render(); });
}

function cancelTrial(){
  var mt = myTrial();
  if (!mt) return;
  if (!state.fresh){ showMsg('読み込み中です。数秒待ってから操作してください。',''); return; }
  if (!window.confirm('体験の申し込みを取り消します。よろしいですか？')) return;
  state.busy = true;
  apiPost({ action:'submit_trial', lineUserId: state.userId, lineName: state.lineName, idToken: state.idToken,
            practiceId: mt.practiceId, cancel: true })
    .then(function(res){
      state.busy = false;
      if (!res.ok){ if (handleAuthFail(res) || handleNeedProfile(res)) return; showMsg('取り消しに失敗しました: ' + (res.error||''),'err'); return; }
      showMsg('','');
      q('result').innerHTML = '<div class="result"><h2>取り消しました</h2><div class="note">またいつでもお申し込みいただけます。</div></div>';
      window.scrollTo(0,0);
      loadAll();
    })
    .catch(function(e){ state.busy = false; showMsg('取り消しに失敗しました（通信）: ' + e,'err'); });
}

/* ---------------- 送信 ---------------- */
q('submitBtn').addEventListener('click', function(){
  if (!state.fresh){ showMsg('最新の内容を読み込み中です。数秒待ってから送信してください。',''); return; }
  if (!state.userId){ showMsg('LINEユーザー情報が取得できていません。開き直してください。','err'); return; }
  if (state.guestForm){ showMsg('友達の入力を「追加する」か「やめる」で確定してから送信してください。', 'err'); return; }
  var ids = Object.keys(state.selected).filter(function(k){ return state.selected[k]; });
  if (ids.length === 0 && state.hadEntries){
    if (!window.confirm('あなたの参加と、連れていく友達の登録をすべて取り消します。よろしいですか？')) return;
  }
  var btn = q('submitBtn');
  btn.disabled = true; btn.textContent = '送信中…'; state.busy = true;
  apiPost({ action:'submit', lineUserId: state.userId, lineName: state.lineName, idToken: state.idToken,
            practiceIds: ids })
    .then(function(res){
      state.busy = false; btn.disabled = false; updateSubmitBtn();
      if (!res.ok){
        if (handleAuthFail(res) || handleNeedProfile(res)) return;
        showMsg('送信に失敗しました: ' + res.error + '\n\n最新の状態を読み直しました。画面のチェックが実際の登録内容です。', 'err');
        state.touched = false; loadAll();      // 画面と実データのズレを防ぐ
        return;
      }
      showMsg('', '');
      renderResult(res.results);
      state.touched = false;
      loadAll();
    })
    .catch(function(e){
      state.busy = false; btn.disabled = false; updateSubmitBtn();
      showMsg('通信が途切れました。保存できているか確認するため、最新の状態を読み直します。\n画面のチェックが実際の登録内容です。', 'err');
      state.touched = false; loadAll();
    });
});

document.getElementById('root').addEventListener('keydown', function(e){
  var pick = e.target.closest('[data-pid]');
  if (pick && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); toggle(pick.getAttribute('data-pid')); }
});
boot();
</script>
