<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>p.b.q 練習日</title>
<style>
  :root{--accent:#FF5A4E;--bg:#f5f5f7;--card:#fff;--line:#e6e6ea;--text:#1c1c1e;--sub:#8a8a8e}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 130px}
  h1{font-size:19px;margin:4px 4px 2px}
  .sub{color:var(--sub);font-size:13px;margin:0 4px 16px;line-height:1.55}
  .hint{font-size:12px;color:var(--sub);margin:2px 4px 12px;line-height:1.5}
  .who{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--sub)}
  .who b{color:var(--text);font-size:15px}
  .status{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;margin:0 4px 16px}
  .dot{width:7px;height:7px;border-radius:999px;background:#1a7f37;flex:none}
  .dot.off{background:#c0392b}
  .day{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
  .day.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,90,78,.14)}
  .day input{margin-top:2px;width:22px;height:22px;accent-color:var(--accent);flex:none}
  .day .body{flex:1;min-width:0}
  .day .d{font-weight:700;font-size:15px;line-height:1.4}
  .day .tp{font-size:13px;color:#3a3a3c;margin-top:3px}
  .day .meta{font-size:12px;color:var(--sub);margin-top:6px}
  .bar{height:5px;background:#ececef;border-radius:999px;margin-top:8px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:8px}
  .b-open{background:#e7f6ec;color:#1a7f37}
  .b-full{background:#fdecea;color:#c0392b}
  .b-mine{background:#fff1e6;color:#c96a1b}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}
  .card .d{font-weight:700;font-size:15px;line-height:1.4}
  .cnt{font-size:13px;color:var(--sub);margin-top:8px}
  .cnt b{color:var(--text);font-size:15px}
  .cnt.wl{margin-top:14px;color:#c96a1b}
  .cbadge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fdecea;color:#c0392b;margin-left:6px}
  ol.names{margin:8px 0 0;padding-left:24px}
  ol.names li{padding:3px 0;font-size:14px;line-height:1.45}
  ol.names.wl li{color:#a15b1e}
  li.none{list-style:none;margin-left:-24px;color:var(--sub);font-size:13px}
  .footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 14px;display:none}
  .footer .inner{max-width:560px;margin:0 auto}
  button.primary{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:15px;font-size:16px;font-weight:700}
  button.primary.warn{background:#c0392b}
  button.primary:disabled{opacity:.5}
  button.ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--text);width:100%}
  .result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .result h2{font-size:16px;margin:0 0 4px}
  .result .grp{margin-top:12px}
  .result .grp .t{font-size:13px;font-weight:700}
  .result .grp.ok .t{color:#1a7f37}
  .result .grp.wait .t{color:#c96a1b}
  .result .grp.cxl .t{color:#8a8a8e}
  .result ul{margin:5px 0 0;padding-left:20px}
  .result li{font-size:14px;line-height:1.6}
  .result .note{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
  .msg{padding:13px 14px;border-radius:10px;margin-bottom:14px;font-size:14px;line-height:1.65;white-space:pre-wrap}
  .msg.err{background:#fdecea;color:#c0392b}
  .loading{text-align:center;color:var(--sub);padding:48px 0}
  a.link{color:var(--accent);font-size:14px;display:inline-block;margin:10px 4px 0;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div id="head"></div>
  <div id="msg"></div>
  <div id="result"></div>
  <div id="root"><div class="loading">読み込み中…</div></div>
  <div id="foot"></div>
</div>

<div class="footer" id="footer">
  <div class="inner"><button class="primary" id="submitBtn">この内容で送信</button></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ============================================================
   p.b.q 練習日 申込フロントエンド（静的ホスティング用）
   - GitHub Pages 等に置いて LIFF のエンドポイントURLにする
   - データは Google Apps Script のAPI(下のAPI)と fetch でやり取り
   ============================================================ */
var LIFF_ID = "2011314745-16BXRKX0";
var API     = "https://script.google.com/macros/s/AKfycbwFleZTrYMBT1ih-WcEpUvVc59dq8e2Bz5M1iLdVBoBB84FP_P--JQm55u2wytCww5-Kg/exec";

var state = { userId:"", lineName:"", idToken:"", view:"form",
              practices:[], roster:[], mine:[], selected:{}, hadEntries:false };
var listTimer = null;

function q(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function showMsg(t,cls){ q('msg').innerHTML = t ? '<div class="msg '+(cls||'')+'">'+esc(t)+'</div>' : ''; if(t) window.scrollTo(0,0); }
function two(n){ return ('0'+n).slice(-2); }

function getView(){
  try{
    var s = new URLSearchParams(location.search);
    if (s.get('view')) return s.get('view');
    var st = s.get('liff.state');
    if (st){
      var raw = st.charAt(0)==='?' ? st.substring(1) : st;
      var s2 = new URLSearchParams(raw);
      if (s2.get('view')) return s2.get('view');
    }
  }catch(e){}
  return 'form';
}

function apiGet(params){
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
  return fetch(API + '?' + qs, { method:'GET' }).then(function(r){ return r.json(); });
}
function apiPost(body){
  return fetch(API, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}
function handleAuthFail(d){
  if (d && d.relogin){ try{ liff.login(); }catch(e){} return true; }
  return false;
}

/* ---------------- 起動 ---------------- */
function boot(){
  if (typeof liff === 'undefined'){
    showMsg('LINEの読み込みに失敗しました。通信環境を確認して開き直してください。','err'); return;
  }
  liff.init({ liffId: LIFF_ID })
    .then(function(){
      if (!liff.isLoggedIn()){ liff.login(); return null; }
      return liff.getProfile();
    })
    .then(function(p){
      if (!p) return;
      state.userId   = p.userId;
      state.lineName = p.displayName || "";
      try { state.idToken = liff.getIDToken() || ""; } catch(e){ state.idToken = ""; }
      state.view = getView();
      if (state.view === 'list') startList();
      else startForm();
    })
    .catch(function(e){
      showMsg('LINE初期化エラー: ' + (e && e.message ? e.message : e) + '\nLINEアプリ内から開き直してください。','err');
    });
}

/* ================= 申込フォーム ================= */
function startForm(){
  q('head').innerHTML =
    '<h1>練習日の申込</h1>' +
    '<p class="sub">行ける日を<b>すべて</b>選んで送信してください（複数選択可）。名前の入力は不要です。<br>' +
    '満席の日はキャンセル待ちで登録され、空きが出たら先着順にLINEで通知します。</p>' +
    '<p class="hint">💡 <b>変更・キャンセル</b>は、このフォームをもう一度開いて、行く日にチェック／行けなくなった日のチェックを外して「送信」するだけ。今の申込状況は最初から反映されています。</p>' +
    '<div class="who">申込者：<b>' + esc(state.lineName) + '</b> さん（LINEアカウントで自動判別）</div>';

  apiGet({ api:'bootstrap', userId: state.userId, idToken: state.idToken })
    .then(function(d){
      if (!d.ok){ if (handleAuthFail(d)) return; showMsg('データ取得に失敗: ' + d.error, 'err'); return; }
      state.practices = d.practices; state.roster = d.roster; state.mine = d.mine;
      state.hadEntries = d.mine.length > 0;
      state.selected = {};
      d.mine.forEach(function(m){ state.selected[m.practiceId] = true; });
      renderForm();
    })
    .catch(function(e){ showMsg('通信エラー: ' + e, 'err'); });
}

function rosterFor(pid){ for (var i=0;i<state.roster.length;i++) if (state.roster[i].id===pid) return state.roster[i]; return null; }
function mineFor(pid){ for (var i=0;i<state.mine.length;i++) if (state.mine[i].practiceId===pid) return state.mine[i]; return null; }

function renderForm(){
  if (!state.practices.length){
    q('root').innerHTML = '<div class="msg err">現在、募集中の練習日がありません。</div>';
    return;
  }
  var html = '';
  state.practices.forEach(function(p){
    var r = rosterFor(p.id) || { confirmed:[], waitlist:[], capacity:p.capacity };
    var mine = mineFor(p.id);
    var conf = r.confirmed.length, cap = r.capacity, wait = r.waitlist.length;
    var sel = !!state.selected[p.id];
    var badge;
    if (mine && mine.status === 'confirmed')      badge = '<span class="badge b-mine">申込済み・参加確定</span>';
    else if (mine && mine.status === 'waitlist')  badge = '<span class="badge b-mine">キャンセル待ち ' + mine.waitlistPos + '番目</span>';
    else if (conf >= cap)                         badge = '<span class="badge b-full">満席（チェックでキャンセル待ちに登録）</span>';
    else                                          badge = '<span class="badge b-open">受付中・あと ' + (cap - conf) + ' 名</span>';
    var pct = Math.min(100, Math.round(conf / cap * 100));
    var tp = [p.time, p.place].filter(function(s){ return s; }).join(' ・ ');
    html += '<div class="day ' + (sel ? 'sel' : '') + '" onclick="toggle(\'' + p.id + '\')">'
      + '<input type="checkbox" ' + (sel ? 'checked' : '') + ' onclick="event.stopPropagation();toggle(\'' + p.id + '\')">'
      + '<div class="body">'
      +   '<div class="d">' + esc(p.date || p.label) + '</div>'
      +   (tp ? '<div class="tp">' + esc(tp) + '</div>' : '')
      +   '<div class="meta">参加確定 ' + conf + ' / ' + cap + ' 名' + (wait > 0 ? '　・　待ち ' + wait + ' 名' : '') + '</div>'
      +   '<div class="bar"><i style="width:' + pct + '%"></i></div>'
      +   '<div>' + badge + '</div>'
      + '</div></div>';
  });
  q('root').innerHTML = html;
  q('foot').innerHTML = '<a class="link" href="' + esc(API) + '" style="display:none"></a>';
  q('footer').style.display = 'block';
  updateSubmitBtn();
}

function selectedCount(){ return Object.keys(state.selected).filter(function(k){ return state.selected[k]; }).length; }
function updateSubmitBtn(){
  var btn = q('submitBtn');
  if (selectedCount() === 0 && state.hadEntries){ btn.textContent = 'すべてキャンセルして送信'; btn.classList.add('warn'); }
  else { btn.textContent = 'この内容で送信'; btn.classList.remove('warn'); }
}
function toggle(pid){ state.selected[pid] = !state.selected[pid]; renderForm(); }

function renderResult(results){
  var ok = results.filter(function(r){ return r.status==='confirmed'; });
  var wait = results.filter(function(r){ return r.status==='waitlist'; });
  var cxl = results.filter(function(r){ return r.status==='cancelled'; });
  var h = '<div class="result"><h2>✅ 送信しました</h2>';
  if (ok.length)   h += '<div class="grp ok"><div class="t">参加確定</div><ul>' + ok.map(function(r){ return '<li>'+esc(r.label)+'</li>'; }).join('') + '</ul></div>';
  if (wait.length) h += '<div class="grp wait"><div class="t">キャンセル待ち（定員オーバーのため）</div><ul>' + wait.map(function(r){ return '<li>'+esc(r.label)+'</li>'; }).join('') + '</ul><div class="note">空きが出た時点で、先着順にLINEで「参加できます」の通知が届きます。現時点ではこの日は参加できません。</div></div>';
  if (cxl.length)  h += '<div class="grp cxl"><div class="t">取り消し</div><ul>' + cxl.map(function(r){ return '<li>'+esc(r.label)+'</li>'; }).join('') + '</ul></div>';
  if (!ok.length && !wait.length && !cxl.length) h += '<div class="note">日程が選択されていません（＝全日程キャンセル）。</div>';
  h += '<div class="note">同じ内容をLINEのトークにも送りました。あとから見返せます。<br>予定が変わったら、選び直して再送信してください。</div></div>';
  q('result').innerHTML = h;
  window.scrollTo(0,0);
}

/* ================= 参加者一覧 ================= */
function startList(){
  q('head').innerHTML =
    '<h1>練習日 参加者一覧</h1>' +
    '<div class="status"><span class="dot" id="dot"></span><span id="updated">読み込み中…</span></div>';
  q('footer').style.display = 'none';
  q('foot').innerHTML = '<button class="ghost" id="reload">今すぐ更新</button>';
  q('reload').addEventListener('click', function(){ loadRoster(false); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) loadRoster(true); });
  loadRoster(false);
}
function loadRoster(silent){
  if (!silent) q('root').innerHTML = '<div class="loading">読み込み中…</div>';
  apiGet({ api:'roster', idToken: state.idToken })
    .then(function(d){
      if (!d.ok){ if (handleAuthFail(d)) return; markLive(false); q('root').innerHTML = '<div class="msg err">取得に失敗: ' + esc(d.error) + '</div>'; }
      else { renderList(d.roster); markLive(true); }
      scheduleList();
    })
    .catch(function(){ markLive(false); scheduleList(); });
}
function scheduleList(){
  clearTimeout(listTimer);
  listTimer = setTimeout(function(){ if (!document.hidden) loadRoster(true); else scheduleList(); }, 15000);
}
function markLive(okState){
  var dot = q('dot'); if (dot) dot.className = 'dot' + (okState ? '' : ' off');
  var u = q('updated'); if (!u) return;
  var dt = new Date();
  u.textContent = (okState ? '自動更新中（約15秒ごと）' : '更新に失敗') +
    '　最終更新 ' + two(dt.getHours()) + ':' + two(dt.getMinutes()) + ':' + two(dt.getSeconds());
}
function renderList(roster){
  if (!roster || !roster.length){ q('root').innerHTML = '<div class="msg err">募集中の練習日がありません。</div>'; return; }
  var html = '';
  roster.forEach(function(p){
    var conf = p.confirmed.length, full = conf >= p.capacity;
    var tp = [p.time, p.place].filter(function(s){ return s; }).join(' ・ ');
    html += '<div class="card">';
    html += '<div class="d">' + esc(p.date || p.label) + '</div>';
    if (tp) html += '<div class="tp" style="font-size:13px;color:#3a3a3c;margin-top:3px">' + esc(tp) + '</div>';
    html += '<div class="cnt">参加確定 <b>' + conf + '</b> / ' + p.capacity + ' 名' + (full ? '<span class="cbadge">満席</span>' : '') + '</div>';
    html += '<ol class="names">' + (conf ? p.confirmed.map(function(n){ return '<li>' + esc(n || '(名前なし)') + '</li>'; }).join('') : '<li class="none">まだいません</li>') + '</ol>';
    if (p.waitlist.length){
      html += '<div class="cnt wl">キャンセル待ち ' + p.waitlist.length + ' 名（先着順）</div>';
      html += '<ol class="names wl">' + p.waitlist.map(function(n){ return '<li>' + esc(n || '(名前なし)') + '</li>'; }).join('') + '</ol>';
    }
    html += '</div>';
  });
  q('root').innerHTML = html;
}

/* ================= 送信ボタン ================= */
q('submitBtn').addEventListener('click', function(){
  if (!state.userId){ showMsg('LINEユーザー情報が取得できていません。開き直してください。','err'); return; }
  var ids = Object.keys(state.selected).filter(function(k){ return state.selected[k]; });
  if (ids.length === 0 && state.hadEntries){
    if (!window.confirm('現在の申込をすべてキャンセルします。よろしいですか？')) return;
  }
  var btn = q('submitBtn');
  btn.disabled = true; btn.textContent = '送信中…';
  apiPost({ action:'submit', lineUserId: state.userId, lineName: state.lineName, idToken: state.idToken, practiceIds: ids })
    .then(function(res){
      btn.disabled = false; updateSubmitBtn();
      if (!res.ok){ if (handleAuthFail(res)) return; showMsg('送信に失敗しました: ' + res.error, 'err'); return; }
      state.roster = res.roster;
      showMsg('', '');
      renderResult(res.results);
      startForm();
    })
    .catch(function(e){
      btn.disabled = false; updateSubmitBtn();
      showMsg('送信に失敗しました（通信）: ' + e, 'err');
    });
});

boot();
</script>
</body>
</html>
