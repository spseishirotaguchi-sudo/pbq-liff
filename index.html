<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>p.b.q 練習日</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
<link rel="dns-prefetch" href="https://api.line.me">
<style>
  :root{--accent:#FF5A4E;--bg:#f5f5f7;--card:#fff;--line:#e6e6ea;--text:#1c1c1e;--sub:#8a8a8e;--wl:#c96a1b}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 130px}
  h1{font-size:19px;margin:4px 4px 2px}
  .sub{color:var(--sub);font-size:13px;margin:0 4px 12px;line-height:1.55}
  .who{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13px;color:var(--sub)}
  .who b{color:var(--text);font-size:15px}
  .refline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 14px;font-size:11.5px;color:var(--sub)}
  .refline button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--text);font-weight:700}
  .refline .live{display:flex;align-items:center;gap:5px}
  .refline .dot{width:6px;height:6px;border-radius:50%;background:#1a7f37;flex:none}
  .refline .dot.off{background:#c0392b}

  .day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .day.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,90,78,.14)}
  .pick{display:flex;align-items:flex-start;gap:12px;padding:14px;cursor:pointer}
  .pick input{margin-top:2px;width:22px;height:22px;accent-color:var(--accent);flex:none}
  .pick .body{flex:1;min-width:0}
  .pick .d{font-weight:700;font-size:15px;line-height:1.4}
  .pick .tp{font-size:13px;color:#3a3a3c;margin-top:3px}
  .pick .meta{font-size:12px;color:var(--sub);margin-top:6px}
  .bar{height:5px;background:#ececef;border-radius:999px;margin-top:8px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:8px}
  .b-open{background:#e7f6ec;color:#1a7f37}
  .b-full{background:#fdecea;color:#c0392b}
  .b-mine{background:#fff1e6;color:#c96a1b}

  .rtoggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:#fafafa;border:0;border-top:1px solid var(--line);padding:11px 14px;font-size:12.5px;color:var(--sub);cursor:pointer;font-weight:700}
  .day.sel .rtoggle{background:#fff7f5}
  .rtoggle .arw{transition:transform .15s;font-size:10px}
  .rtoggle[aria-expanded="true"] .arw{transform:rotate(180deg)}
  .rpanel{padding:4px 14px 14px;border-top:1px solid var(--line)}
  .rpanel[hidden]{display:none}
  .rgrp{margin-top:10px}
  .rgrp .rt{font-size:12px;font-weight:700;color:var(--sub)}
  .rgrp.w .rt{color:var(--wl)}
  .rgrp ol{margin:5px 0 0;padding-left:22px}
  .rgrp ol li{font-size:13.5px;line-height:1.5;padding:1px 0}
  .rgrp.w ol li{color:#a15b1e}
  .rgrp .none{list-style:none;margin-left:-22px;color:var(--sub);font-size:12.5px}

  .gbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px}
  .gbox-h{font-weight:700;font-size:15px}
  .gbox-sub{font-size:12px;color:var(--sub);margin:4px 0 8px;line-height:1.55}
  .grow{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .grow:first-of-type{border-top:0}
  .grow .gcol{flex:1;min-width:0}
  .grow .gnm{font-weight:600}
  .grow .gmeta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .grow .gmeta.wait{color:var(--wl)}
  .grow .grm{background:transparent;border:1px solid var(--line);border-radius:6px;width:24px;height:24px;color:var(--sub);font-size:14px;line-height:1;flex:none}
  .gadd{background:transparent;border:1px dashed var(--line);border-radius:8px;padding:11px;font-size:13px;color:var(--sub);font-weight:700;width:100%;margin-top:8px}
  .gform{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .gform input,.gform select{font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);width:100%}
  .gform .row{display:flex;gap:8px}
  .gform .row .age{flex:1;min-width:0}
  .gform .row .gen{width:108px;flex:none}
  .gform-btns{display:flex;gap:8px}
  .gform-btns button{flex:1;padding:11px;border-radius:8px;font-size:14px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--text)}
  .gform-btns button.add{background:var(--accent);color:#fff;border-color:var(--accent)}

  .footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 14px;display:none}
  .footer .inner{max-width:560px;margin:0 auto}
  button.primary{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:15px;font-size:16px;font-weight:700}
  button.primary.warn{background:#c0392b}
  button.primary:disabled{opacity:.5}

  .result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .result h2{font-size:16px;margin:0 0 4px}
  .result .grp{margin-top:12px}
  .result .grp .t{font-size:13px;font-weight:700}
  .result .grp.ok .t{color:#1a7f37}
  .result .grp.wait .t{color:#c96a1b}
  .result .grp.cxl .t{color:#8a8a8e}
  .result ul{margin:5px 0 0;padding-left:20px}
  .result li{font-size:14px;line-height:1.6}
  .result .note{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
  .msg{padding:13px 14px;border-radius:10px;margin-bottom:14px;font-size:14px;line-height:1.65;white-space:pre-wrap}
  .msg.err{background:#fdecea;color:#c0392b}
  .loading{text-align:center;color:var(--sub);padding:48px 0}
</style>
</head>
<body>
<div class="wrap">
  <div id="head"></div>
  <div id="msg"></div>
  <div id="result"></div>
  <div id="root"><div class="loading">読み込み中…</div></div>
</div>

<div class="footer" id="footer">
  <div class="inner"><button class="primary" id="submitBtn">この内容で送信</button></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ============================================================
   p.b.q 練習日 参加投票 ＋ 参加状況 ＋ 友達紹介（1画面）
   フロント＝GitHub Pages / データ＝GAS API を fetch
   ============================================================ */
var LIFF_ID = "2011314745-16BXRKX0";
var API     = "https://script.google.com/macros/s/AKfycbwFleZTrYMBT1ih-WcEpUvVc59dq8e2Bz5M1iLdVBoBB84FP_P--JQm55u2wytCww5-Kg/exec";
var REFRESH_MS = 25000;

var state = { userId:"", lineName:"", idToken:"",
              practices:[], roster:[], mine:[], myGuests:[],
              selected:{}, guests:[], expanded:{}, guestForm:false,
              hadEntries:false, busy:false, touched:false };
var refreshTimer = null;

function saveSnapshot(){
  try{ localStorage.setItem('pbq_snap', JSON.stringify({
    practices: state.practices, roster: state.roster, mine: state.mine, myGuests: state.myGuests, ts: Date.now()
  })); }catch(e){}
}
function loadSnapshot(){
  try{
    var s = JSON.parse(localStorage.getItem('pbq_snap') || 'null');
    if (s && s.practices && s.practices.length && (Date.now() - s.ts) < 20*60*1000) return s;
  }catch(e){}
  return null;
}

function q(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function showMsg(t,cls){ q('msg').innerHTML = t ? '<div class="msg '+(cls||'')+'">'+esc(t)+'</div>' : ''; if(t) window.scrollTo(0,0); }
function two(n){ return ('0'+n).slice(-2); }

function apiGet(params){
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
  return fetch(API + '?' + qs, { method:'GET' }).then(function(r){ return r.json(); });
}
function apiPost(body){
  return fetch(API, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(body) }).then(function(r){ return r.json(); });
}
function handleAuthFail(d){ if (d && d.relogin){ try{ liff.login(); }catch(e){} return true; } return false; }

/* ---------------- 起動 ---------------- */
function boot(){
  if (typeof liff === 'undefined'){
    showMsg('LINEの読み込みに失敗しました。通信環境を確認して開き直してください。','err'); return;
  }
  liff.init({ liffId: LIFF_ID })
    .then(function(){
      if (!liff.isLoggedIn()){ liff.login(); return null; }
      return liff.getProfile();
    })
    .then(function(p){
      if (!p) return;
      state.userId   = p.userId;
      state.lineName = p.displayName || "";
      try { state.idToken = liff.getIDToken() || ""; } catch(e){ state.idToken = ""; }
      start();
    })
    .catch(function(e){
      showMsg('LINE初期化エラー: ' + (e && e.message ? e.message : e) + '\nLINEアプリ内から開き直してください。','err');
    });
}

function start(){
  q('head').innerHTML =
    '<h1>練習日の参加投票</h1>' +
    '<p class="sub">行ける日を<b>すべて</b>選んで送信（複数選択可・名前入力なし）。満席の日はキャンセル待ちになり、空きが出たら先着順にLINEで通知します。<br>' +
    '各日の<b>「参加者リスト」</b>で確定メンバーとキャンセル待ちが見られます。<b>友達を連れていく</b>ときは、いちばん下の欄から追加してください。</p>' +
    '<div class="who">あなた：<b>' + esc(state.lineName) + '</b> さん（LINEアカウントで自動判別）</div>' +
    '<div class="refline"><span class="live"><span class="dot" id="dot"></span><span id="fresh">読み込み中…</span></span>' +
    '<button id="refreshBtn">更新</button></div>';
  q('refreshBtn').addEventListener('click', function(){ silentRefresh(true); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) silentRefresh(false); });

  var snap = loadSnapshot();
  if (snap){
    state.practices = snap.practices; state.roster = snap.roster;
    state.mine = snap.mine || []; state.myGuests = snap.myGuests || [];
    seedFromServer();
    render();
    var f = q('fresh'); if (f) f.textContent = '最新に更新中…';
  }
  loadAll();
}

function seedFromServer(){
  state.hadEntries = (state.mine.length > 0) || (state.myGuests.length > 0);
  if (state.touched) return;
  state.selected = {};
  state.mine.forEach(function(m){ state.selected[m.practiceId] = true; });
  state.guests = state.myGuests.map(function(g){
    return { name:g.name, age:g.age, gender:g.gender, practiceId:g.practiceId };
  });
}

/* ---------------- データ取得 ---------------- */
function loadAll(){
  apiGet({ api:'bootstrap', userId: state.userId, idToken: state.idToken })
    .then(function(d){
      if (!d.ok){ if (handleAuthFail(d)) return; markLive(false); showMsg('データ取得に失敗: ' + d.error, 'err'); return; }
      state.practices = d.practices; state.roster = d.roster;
      state.mine = d.mine || []; state.myGuests = d.myGuests || [];
      seedFromServer();
      markLive(true);
      render();
      saveSnapshot();
      scheduleRefresh();
    })
    .catch(function(e){ markLive(false); showMsg('通信エラー: ' + e, 'err'); scheduleRefresh(); });
}

function silentRefresh(manual){
  if (state.busy || state.guestForm) return;
  apiGet({ api:'roster', idToken: state.idToken })
    .then(function(d){
      if (d && d.ok && d.roster){
        state.roster = d.roster;
        var y = window.scrollY;
        markLive(true); render();
        window.scrollTo(0, y);
        saveSnapshot();
      } else { markLive(false); }
      if (!manual) scheduleRefresh();
    })
    .catch(function(){ markLive(false); if (!manual) scheduleRefresh(); });
  if (manual) scheduleRefresh();
}
function scheduleRefresh(){
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(function(){
    if (document.hidden || state.busy || state.guestForm){ scheduleRefresh(); return; }
    silentRefresh(false);
  }, REFRESH_MS);
}
function markLive(ok){
  var dot = q('dot'); if (dot) dot.className = 'dot' + (ok ? '' : ' off');
  var f = q('fresh'); if (!f) return;
  var t = new Date();
  f.textContent = (ok ? '自動更新中（約' + (REFRESH_MS/1000) + '秒）・' : '更新失敗・') +
    two(t.getHours()) + ':' + two(t.getMinutes());
}

/* ---------------- 描画 ---------------- */
function pById(pid){ for (var i=0;i<state.practices.length;i++) if (state.practices[i].id===pid) return state.practices[i]; return null; }
function rosterFor(pid){ for (var i=0;i<state.roster.length;i++) if (state.roster[i].id===pid) return state.roster[i]; return null; }
function mineFor(pid){ for (var i=0;i<state.mine.length;i++) if (state.mine[i].practiceId===pid) return state.mine[i]; return null; }
function guestStatusOf(g){
  for (var i=0;i<state.myGuests.length;i++){
    var m = state.myGuests[i];
    if (m.practiceId===g.practiceId && m.name===g.name) return m;
  }
  return null;
}

function nameList(arr){
  if (!arr || !arr.length) return '<li class="none">まだいません</li>';
  return arr.map(function(n){ return '<li>' + esc(n || '(名前なし)') + '</li>'; }).join('');
}

function render(){
  if (!state.practices.length){
    q('root').innerHTML = '<div class="msg err">現在、募集中の練習日がありません。</div>';
    q('footer').style.display = 'none';
    return;
  }
  var html = '';
  state.practices.forEach(function(p){
    var r = rosterFor(p.id) || { confirmed:[], waitlist:[], capacity:p.capacity };
    var mine = mineFor(p.id);
    var conf = r.confirmed.length, cap = r.capacity, wait = r.waitlist.length;
    var sel = !!state.selected[p.id];
    var open = !!state.expanded[p.id];

    var badge;
    if (mine && mine.status === 'confirmed')      badge = '<span class="badge b-mine">投票済み・参加確定</span>';
    else if (mine && mine.status === 'waitlist')  badge = '<span class="badge b-mine">キャンセル待ち ' + mine.waitlistPos + '番目</span>';
    else if (conf >= cap)                         badge = '<span class="badge b-full">満席（チェックでキャンセル待ちに登録）</span>';
    else                                          badge = '<span class="badge b-open">受付中・あと ' + (cap - conf) + ' 名</span>';

    var pct = Math.min(100, Math.round(conf / cap * 100));
    var tp = [p.time, p.place].filter(function(s){ return s; }).join(' ・ ');

    html += '<div class="day ' + (sel ? 'sel' : '') + '">'
      + '<div class="pick" onclick="toggle(\'' + p.id + '\')">'
      +   '<input type="checkbox" ' + (sel ? 'checked' : '') + ' onclick="event.stopPropagation();toggle(\'' + p.id + '\')">'
      +   '<div class="body">'
      +     '<div class="d">' + esc(p.date || p.label) + '</div>'
      +     (tp ? '<div class="tp">' + esc(tp) + '</div>' : '')
      +     '<div class="meta">参加確定 ' + conf + ' / ' + cap + ' 名' + (wait > 0 ? '　・　待ち ' + wait + ' 名' : '') + '</div>'
      +     '<div class="bar"><i style="width:' + pct + '%"></i></div>'
      +     '<div>' + badge + '</div>'
      +   '</div>'
      + '</div>'
      + '<button class="rtoggle" aria-expanded="' + (open ? 'true' : 'false') + '" onclick="toggleExpand(\'' + p.id + '\')">'
      +   '<span>参加者リスト（確定 ' + conf + (wait > 0 ? ' ／ 待ち ' + wait : '') + '）</span><span class="arw">▼</span>'
      + '</button>'
      + '<div class="rpanel" id="rp-' + p.id + '" ' + (open ? '' : 'hidden') + '>'
      +   '<div class="rgrp"><div class="rt">参加確定（' + conf + ' / ' + cap + '）</div><ol>' + nameList(r.confirmed) + '</ol></div>'
      +   (wait > 0 ? '<div class="rgrp w"><div class="rt">キャンセル待ち（' + wait + '・先着順）</div><ol>' + r.waitlist.map(function(n){ return '<li>' + esc(n || '(名前なし)') + '</li>'; }).join('') + '</ol></div>' : '')
      + '</div>'
      + '</div>';
  });

  html += guestSectionHtml();

  q('root').innerHTML = html;
  q('footer').style.display = 'block';
  updateSubmitBtn();
  if (state.guestForm){ var n = q('gf-name'); if (n) n.focus(); }
}

function guestSectionHtml(){
  var h = '<div class="gbox"><div class="gbox-h">友達を連れていく</div>'
    + '<p class="gbox-sub">友達の名前・年齢・性別と、参加する練習日を選んで追加します。'
    + '複数日来るなら、日ごとに1回ずつ追加してください。会費とマナーは紹介者がフォローをお願いします。</p>';

  state.guests.forEach(function(g, idx){
    var p = pById(g.practiceId);
    var dayLabel = p ? (p.date + (p.place ? '　' + p.place : '')) : g.practiceId;
    var gs = guestStatusOf(g);
    var st = !gs ? '未送信（送信で登録）'
      : (gs.status === 'waitlist' ? 'キャンセル待ち ' + gs.waitlistPos + '番目' : '参加確定');
    var wc = (gs && gs.status === 'waitlist') ? ' wait' : '';
    h += '<div class="grow"><div class="gcol">'
      +   '<div class="gnm">' + esc(g.name) + '（' + esc(g.age) + '）' + esc(g.gender) + '</div>'
      +   '<div class="gmeta' + wc + '">' + esc(dayLabel) + ' — ' + st + '</div>'
      + '</div><button class="grm" onclick="removeGuest(' + idx + ')">×</button></div>';
  });

  if (state.guestForm){
    var opts = state.practices.map(function(p){
      return '<option value="' + esc(p.id) + '">' + esc(p.date + (p.place ? '　' + p.place : '')) + '</option>';
    }).join('');
    h += '<div class="gform">'
      + '<input id="gf-name" placeholder="友達の名前" autocomplete="off">'
      + '<div class="row"><input id="gf-age" class="age" type="number" inputmode="numeric" placeholder="年齢">'
      + '<select id="gf-gender" class="gen"><option>男性</option><option>女性</option><option>その他</option></select></div>'
      + '<select id="gf-day">' + opts + '</select>'
      + '<div class="gform-btns"><button class="add" onclick="addGuest()">追加する</button>'
      + '<button onclick="closeGuestForm()">やめる</button></div>'
      + '</div>';
  } else {
    h += '<button class="gadd" onclick="openGuestForm()">＋ 友達を追加</button>';
  }
  h += '</div>';
  return h;
}

function toggleExpand(pid){
  state.expanded[pid] = !state.expanded[pid];
  var panel = q('rp-' + pid);
  if (panel){
    panel.hidden = !state.expanded[pid];
    var btn = panel.previousElementSibling;
    if (btn) btn.setAttribute('aria-expanded', state.expanded[pid] ? 'true' : 'false');
  }
}

/* 友達の追加・削除 */
function openGuestForm(){ state.guestForm = true; render(); }
function closeGuestForm(){ state.guestForm = false; showMsg('',''); render(); }
function addGuest(){
  var name = (q('gf-name').value || '').trim();
  var age  = (q('gf-age').value || '').trim();
  var gender = q('gf-gender').value;
  var pid = q('gf-day').value;
  if (!name){ showMsg('友達の名前を入力してください。', 'err'); return; }
  if (!age){ showMsg('友達の年齢を入力してください（だいたいでOK）。', 'err'); return; }
  if (!pid){ showMsg('参加する練習日を選んでください。', 'err'); return; }
  if (state.guests.some(function(g){ return g.practiceId === pid && g.name === name; })){
    showMsg('その練習日に同じ名前の友達がすでに登録されています。', 'err'); return;
  }
  state.guests.push({ name: name, age: age, gender: gender, practiceId: pid });
  state.touched = true;
  state.guestForm = false;
  showMsg('', '');
  render();
}
function removeGuest(idx){
  state.guests.splice(idx, 1);
  state.touched = true;
  render();
}

function selectedCount(){ return Object.keys(state.selected).filter(function(k){ return state.selected[k]; }).length; }
function updateSubmitBtn(){
  var btn = q('submitBtn');
  if (selectedCount() === 0 && state.guests.length === 0 && state.hadEntries){
    btn.textContent = 'すべて取り消して送信'; btn.classList.add('warn');
  } else {
    btn.textContent = 'この内容で送信'; btn.classList.remove('warn');
  }
}
function toggle(pid){ state.touched = true; state.selected[pid] = !state.selected[pid]; render(); }

function renderResult(results){
  var ok = results.filter(function(r){ return r.status==='confirmed'; });
  var wait = results.filter(function(r){ return r.status==='waitlist'; });
  var cxl = results.filter(function(r){ return r.status==='cancelled'; });
  var h = '<div class="result"><h2>✅ 送信しました</h2>';
  if (ok.length)   h += '<div class="grp ok"><div class="t">参加確定</div><ul>' + ok.map(function(r){ return '<li>'+esc(r.label)+'</li>'; }).join('') + '</ul></div>';
  if (wait.length) h += '<div class="grp wait"><div class="t">キャンセル待ち（定員オーバーのため）</div><ul>' + wait.map(function(r){ return '<li>'+esc(r.label)+'</li>'; }).join('') + '</ul><div class="note">空きが出た時点で、先着順にLINEで「参加できます」の通知が届きます。友達の分は紹介者に通知します。</div></div>';
  if (cxl.length)  h += '<div class="grp cxl"><div class="t">取り消し</div><ul>' + cxl.map(function(r){ return '<li>'+esc(r.label)+'</li>'; }).join('') + '</ul></div>';
  if (!ok.length && !wait.length && !cxl.length) h += '<div class="note">日程が選択されていません（＝すべて取り消し）。</div>';
  h += '<div class="note">同じ内容をLINEのトークにも送りました。予定が変わったら、選び直して再送信してください。</div></div>';
  q('result').innerHTML = h;
  window.scrollTo(0,0);
}

/* ---------------- 送信 ---------------- */
q('submitBtn').addEventListener('click', function(){
  if (!state.userId){ showMsg('LINEユーザー情報が取得できていません。開き直してください。','err'); return; }
  if (state.guestForm){ showMsg('友達の入力を「追加する」か「やめる」で確定してから送信してください。', 'err'); return; }
  var ids = Object.keys(state.selected).filter(function(k){ return state.selected[k]; });
  if (ids.length === 0 && state.guests.length === 0 && state.hadEntries){
    if (!window.confirm('あなたの参加と、連れていく友達の登録をすべて取り消します。よろしいですか？')) return;
  }
  var btn = q('submitBtn');
  btn.disabled = true; btn.textContent = '送信中…'; state.busy = true;
  apiPost({ action:'submit', lineUserId: state.userId, lineName: state.lineName, idToken: state.idToken,
            practiceIds: ids, guests: state.guests })
    .then(function(res){
      state.busy = false; btn.disabled = false; updateSubmitBtn();
      if (!res.ok){ if (handleAuthFail(res)) return; showMsg('送信に失敗しました: ' + res.error, 'err'); return; }
      showMsg('', '');
      renderResult(res.results);
      apiPost({ action:'notify', lineUserId: state.userId, idToken: state.idToken, results: res.results }).catch(function(){});
      state.touched = false;
      loadAll();
    })
    .catch(function(e){
      state.busy = false; btn.disabled = false; updateSubmitBtn();
      showMsg('送信に失敗しました（通信）: ' + e, 'err');
    });
});

boot();
</script>
</body>
</html>
